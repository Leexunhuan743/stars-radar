name: Deploy Worker

on:
  push:
    branches: [master, main]
    paths:
      - src/**
      - data/intents.json
      - wrangler.jsonc
      - package.json
      - pnpm-lock.yaml
      - .node-version
      - .github/workflows/deploy-worker.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stars-radar-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      WORKER_URL: ${{ vars.WORKER_URL }}
      MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Require deployment configuration
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN is required"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::R2_ACCOUNT_ID is required"; exit 1; }
          test -n "${R2_BUCKET}" || { echo "::error::R2_BUCKET is required"; exit 1; }
          test -n "${AWS_ACCESS_KEY_ID}" || { echo "::error::R2_ACCESS_KEY_ID is required"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY}" || { echo "::error::R2_SECRET_ACCESS_KEY is required"; exit 1; }
          test -n "${WORKER_URL}" || { echo "::error::WORKER_URL is required for post-deploy verification"; exit 1; }
          test -n "${MCP_API_KEY}" || { echo "::error::MCP_API_KEY is required for post-deploy verification"; exit 1; }

      - name: Require production Worker auth secrets before deploy
        run: |
          pnpm exec wrangler secret list --format json > "${RUNNER_TEMP}/worker-bindings.json"
          node --input-type=module - "${RUNNER_TEMP}/worker-bindings.json" <<'NODE'
          import fs from 'node:fs'
          const secrets = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const names = new Set((Array.isArray(secrets) ? secrets : []).map(secret => secret?.name).filter(Boolean))
          const required = ['MCP_API_KEY', 'MCP_WRITE_API_KEY']
          const missing = required.filter(name => !names.has(name))
          if (missing.length > 0)
            throw new Error(`Production Worker is missing required secret binding(s): ${missing.join(', ')}`)
          console.log(`Production Worker auth secrets present: ${required.join(', ')}`)
          NODE

      - name: Require an active immutable data generation before deploy
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://${R2_BUCKET}/active-generation.json" "${RUNNER_TEMP}/active-generation.json" \
            --endpoint-url "${endpoint}" --only-show-errors
          generation=$(node --input-type=module - "${RUNNER_TEMP}/active-generation.json" <<'NODE'
          import fs from 'node:fs'
          import { parseGenerationPointer } from './src/data-generation.js'
          console.log(parseGenerationPointer(JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))).id)
          NODE
          )
          aws s3api head-object --bucket "${R2_BUCKET}" \
            --key "generations/${generation}/generation-manifest.json" \
            --endpoint-url "${endpoint}" >/dev/null
          echo "Active data generation ready: ${generation}"

      - name: Verify bundle
        run: pnpm exec wrangler deploy --dry-run --outdir dist

      - name: Deploy Worker
        run: pnpm exec wrangler deploy

      - name: Production smoke check
        run: |
          base="${WORKER_URL%/}"
          curl --fail-with-body --silent --show-error             --retry 4 --retry-all-errors --retry-delay 2             -H "Authorization: Bearer ${MCP_API_KEY}"             "${base}/health" > "${RUNNER_TEMP}/health.json"
          node --input-type=module - "${RUNNER_TEMP}/health.json" <<'NODE'
          import fs from 'node:fs'
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const health = payload.data || payload
          if (health.version !== '2.0.0')
            throw new Error(`Unexpected production version: ${health.version}`)
          if (health.status !== 'ok')
            throw new Error(`Production health is ${health.status}`)
          if (!health.dataGeneration?.id)
            throw new Error('Production has no active data generation.')
          console.log(`Production healthy: v${health.version}, generation ${health.dataGeneration.id}`)
          NODE
