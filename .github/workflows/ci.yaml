name: CI

# Merge gate. build.yaml only runs on a schedule, so before this workflow existed
# nothing verified a push or a pull request: lint was never run anywhere and the
# test suite only ran as a side effect of the 6-hourly data job.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Catches the drift class that only shows up at runtime: an invalid
      # wrangler config or a module that cannot be bundled for workerd.
      - name: Build (dry-run bundle for Cloudflare Workers)
        run: pnpm exec wrangler deploy --dry-run --outdir dist
