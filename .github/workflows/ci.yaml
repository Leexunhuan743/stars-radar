name: CI

# Merge gate. build.yaml only runs on a schedule, so before this workflow existed
# nothing verified a push or a pull request: lint was never run anywhere and the
# test suite only ran as a side effect of the 6-hourly data job.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Catches the drift class that only shows up at runtime: an invalid
      # wrangler config or a module that cannot be bundled for workerd.
      - name: Build (dry-run bundle for Cloudflare Workers)
        run: pnpm exec wrangler deploy --dry-run --outdir dist
