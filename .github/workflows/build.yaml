name: Update Repos Info

on:
  schedule:
    # Runs every 6 hours (00:22, 06:22, 12:22, 18:22 UTC) to keep community rankings and new stars fresh
    - cron: '22 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege: this job publishes through R2 and the Worker's own credentials, never through
    # git. It carried `contents: write` for the commit-and-push step that used to publish its
    # outputs; that step is gone (§P2), so the token no longer needs to write anything.
    permissions:
      contents: read
    # Publication changes the active pointer and prunes derived generations, so data runs are
    # serialized. Raw state and content-addressed README blobs remain append-only.
    concurrency:
      group: stars-radar-data-publish
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
      RETRIEVAL_BENCHMARK_B64: ${{ secrets.RETRIEVAL_BENCHMARK_B64 }}
      GENERATION_RETENTION: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Resolve active data generation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if aws s3api head-object --bucket "${R2_BUCKET}" --key "active-generation.json" \
            --endpoint-url "${endpoint}" >/dev/null 2>dl.err; then
            aws s3 cp "s3://${R2_BUCKET}/active-generation.json" active-generation.json --endpoint-url "${endpoint}"
            active=$(node --input-type=module -e 'import fs from "node:fs"; import { parseGenerationPointer } from "./src/data-generation.js"; console.log(parseGenerationPointer(JSON.parse(fs.readFileSync("active-generation.json","utf-8"))).id)')
            echo "ACTIVE_GENERATION_ID=${active}" >> "${GITHUB_ENV}"
            echo "Active data generation: ${active}"
          elif grep -q "HeadObject" dl.err && grep -Eq "\(404\)|NoSuchKey" dl.err; then
            echo "ACTIVE_GENERATION_ID=" >> "${GITHUB_ENV}"
            echo "No active generation yet; bootstrapping a fresh v2 data plane."
          else
            echo "::error::Could not resolve active-generation.json:"
            cat dl.err
            exit 1
          fi
          rm -f dl.err

      - name: Download current vector generation from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rm -f embeddings.bin embeddings-index.json embeddings-fingerprints.json embeddings-manifest.json
          if [ -z "${ACTIVE_GENERATION_ID}" ]; then
            echo "Fresh data plane: no vector baseline to restore."
            exit 0
          fi
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="generations/${ACTIVE_GENERATION_ID}"
          if aws s3api head-object --bucket "${R2_BUCKET}" --key "${prefix}/embeddings-manifest.json" \
            --endpoint-url "${endpoint}" >/dev/null 2>vector-head.err; then
            for obj in embeddings.bin embeddings-index.json embeddings-fingerprints.json embeddings-manifest.json; do
              aws s3 cp "s3://${R2_BUCKET}/${prefix}/${obj}" "${obj}" --endpoint-url "${endpoint}"
            done
          elif grep -q "HeadObject" vector-head.err && grep -Eq "\(404\)|NoSuchKey" vector-head.err; then
            echo "Active generation ${ACTIVE_GENERATION_ID} has no vector set (empty semantic corpus)."
          else
            echo "::error::Could not inspect the active generation vector set:"
            cat vector-head.err
            exit 1
          fi
          rm -f vector-head.err

      - name: Download active generation baseline from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rm -f catalog.json asset-state.json previous-asset-index.json
          mkdir -p rankings
          rm -f rankings/rankings.json
          if [ -z "${ACTIVE_GENERATION_ID}" ]; then
            echo "Fresh data plane: no derived baseline to restore."
          else
            aws configure set default.region auto
            endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            prefix="generations/${ACTIVE_GENERATION_ID}"
            for spec in "catalog.json:catalog.json" "rankings.json:rankings/rankings.json" "asset-state.json:asset-state.json" "asset-index.json:previous-asset-index.json"; do
              key="${spec%%:*}"
              local_path="${spec##*:}"
              aws s3 cp "s3://${R2_BUCKET}/${prefix}/${key}" "${local_path}" --endpoint-url "${endpoint}"
            done
          fi

      - name: Download unseen ingest journal tail from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          mkdir -p state/ingest-journal
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          listing="${RUNNER_TEMP}/ingest-journal.json"
          plan="${RUNNER_TEMP}/ingest-tail.tsv"
          aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "state/ingest-journal/" \
            --endpoint-url "${endpoint}" --output json > "${listing}"
          node scripts/state_tail_plan.js ingest "${listing}" previous-asset-index.json > "${plan}"
          remote=$(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1]));console.log((d.Contents||[]).length)' "${listing}")
          unseen=$(wc -l < "${plan}" | tr -d ' ')
          echo "Ingest journal objects in R2: ${remote}; unseen tail: ${unseen}"
          export endpoint R2_BUCKET
          xargs -0 -r -P 16 -n 2 bash -c '
            key="$1"; local_path="$2"
            mkdir -p "$(dirname "$local_path")"
            aws s3 cp "s3://${R2_BUCKET}/${key}" "$local_path" --endpoint-url "${endpoint}" --only-show-errors
          ' _ < <(awk -F '\t' '{printf "%s%c%s%c",$1,0,$2,0}' "${plan}")
          echo "Downloaded ${unseen} unseen ingest journal object(s)."

      - name: Download unseen probe capture tail from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          mkdir -p state/probe-captures
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          listing="${RUNNER_TEMP}/probe-captures.json"
          plan="${RUNNER_TEMP}/probe-tail.tsv"
          aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "state/probe-captures/" \
            --endpoint-url "${endpoint}" --output json > "${listing}"
          node scripts/state_tail_plan.js probe "${listing}" previous-asset-index.json > "${plan}"
          remote=$(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1]));console.log((d.Contents||[]).length)' "${listing}")
          unseen=$(wc -l < "${plan}" | tr -d ' ')
          echo "Probe capture objects in R2: ${remote}; unseen tail: ${unseen}"
          export endpoint R2_BUCKET
          xargs -0 -r -P 16 -n 2 bash -c '
            key="$1"; local_path="$2"
            mkdir -p "$(dirname "$local_path")"
            aws s3 cp "s3://${R2_BUCKET}/${key}" "$local_path" --endpoint-url "${endpoint}" --only-show-errors
          ' _ < <(awk -F '\t' '{printf "%s%c%s%c",$1,0,$2,0}' "${plan}")
          echo "Downloaded ${unseen} unseen probe capture object(s)."

      - name: Restore active generation README corpus
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rm -rf stars
          mkdir -p stars
          if [ -z "${ACTIVE_GENERATION_ID}" ]; then
            echo "Fresh data plane: no README corpus to restore."
            exit 0
          fi
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://${R2_BUCKET}/generations/${ACTIVE_GENERATION_ID}/readmes.json"             "${RUNNER_TEMP}/readmes.json" --endpoint-url "${endpoint}"
          cp "${RUNNER_TEMP}/readmes.json" previous-readmes.json
          node scripts/restore_readme_corpus.js "${RUNNER_TEMP}/readmes.json" > "${RUNNER_TEMP}/readmes.tsv"

          # The corpus is ~20 MB across ~1,200 objects averaging 17 KB, so the cost of restoring it
          # was never bandwidth: one `aws s3 cp` per blob spent most of its life in CLI startup and
          # TLS handshake, and 1,137 of them serialised behind a 16-way fan-out took ~5.6 min.
          #
          # `s3 sync` moves the whole prefix in a single process with its own transfer pool, then
          # the blobs are renamed into the `<owner>/<repo>.md` layout the pipeline expects. The
          # rename is a filesystem move, not a transfer: the bytes come down once, in one pass.
          aws s3 sync "s3://${R2_BUCKET}/readmes/" "${RUNNER_TEMP}/readme-blobs/"             --endpoint-url "${endpoint}" --only-show-errors

          node --input-type=module - "${RUNNER_TEMP}/readmes.tsv" "${RUNNER_TEMP}/readme-blobs" <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          const [tsvPath, blobDir] = process.argv.slice(2)
          const rows = fs.readFileSync(tsvPath, 'utf8').split('\n').filter(Boolean)
          let placed = 0
          let missing = 0
          for (const row of rows) {
            const [key, localPath] = row.split('\t')
            const source = path.join(blobDir, path.basename(key))
            if (!fs.existsSync(source)) {
              missing += 1
              continue
            }
            const target = path.resolve(localPath)
            fs.mkdirSync(path.dirname(target), { recursive: true })
            fs.renameSync(source, target)
            placed += 1
          }
          if (missing > 0)
            throw new Error(`${missing} README blob(s) were not present in the bucket listing; the corpus is incomplete.`)
          console.log(`Placed ${placed} README blob(s) into the corpus layout.`)
          NODE
          echo "Restored $(find stars -name '*.md' | wc -l) README(s) from active generation ${ACTIVE_GENERATION_ID}."

          # Hash every blob just downloaded and record the digests. The validation step at the end
          # of the run would otherwise fetch this exact set again purely to confirm bytes that were
          # already on disk here. Producing the receipt only removes work that has happened: it
          # names what was verified, and the validator still fetches anything absent from it.
          #
          # The path is exported through GITHUB_ENV because `runner.temp` is not available to a
          # job-level `env:` block, and every later step has to agree on one location.
          receipt="${RUNNER_TEMP}/readme-verify-receipt.json"
          echo "README_VERIFY_RECEIPT_FILE=${receipt}" >> "${GITHUB_ENV}"
          node --input-type=module - "${RUNNER_TEMP}/readmes.json" "${receipt}" <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createHash } from 'node:crypto'
          import { localReadmePath, readmeBlobKey } from './src/object-keys.js'

          const [manifestPath, receiptPath] = process.argv.slice(2)
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          const verified = {}
          let missing = 0
          for (const ref of Object.values(manifest.repos || {})) {
            if (!ref?.sha256 || !ref.repo)
              continue
            const file = localReadmePath(ref.repo)
            if (!fs.existsSync(file)) {
              missing += 1
              continue
            }
            const observed = createHash('sha256').update(fs.readFileSync(file)).digest('hex')
            // Only a blob whose bytes still match its own name is recorded: a mismatch here is a
            // corrupt restore, and the absence from the receipt makes the validator fetch it and
            // fail there, rather than this step silently vouching for a bad file.
            if (observed === ref.sha256)
              verified[readmeBlobKey(ref.sha256)] = ref.sha256
          }
          fs.writeFileSync(receiptPath, JSON.stringify({
            schema: 1,
            generation: manifest.generation?.id ?? null,
            verified,
          }))
          console.log(`Restore receipt: ${Object.keys(verified).length} blob(s) hashed, ${missing} not present locally.`)
          NODE

      - name: Fetch starred repos and READMEs (incremental)
        run: pnpm build:stars
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}

      - name: Build unified asset index (accumulate starred + community + probes)
        run: node scripts/asset_store.js

      - name: Build complete hot-set vector corpus
        run: node scripts/build_candidate_vectors.js

      - name: Verify embeddings.bin invariant before upload
        run: node scripts/verify_vector_pair.js

      - name: Require private retrieval closure benchmark
        run: |
          test -n "${RETRIEVAL_BENCHMARK_B64}" || { echo "::error::RETRIEVAL_BENCHMARK_B64 is required before candidate data activation"; exit 1; }
          printf '%s' "${RETRIEVAL_BENCHMARK_B64}" | base64 --decode > data/retrieval-benchmark.private.json
          node scripts/validate_private_benchmark.js data/retrieval-benchmark.private.json

      - name: Enforce private candidate retrieval quality gate
        run: |
          pnpm eval:retrieval:gate -- \
            --fixture data/retrieval-benchmark.private.json \
            --output retrieval-quality-private-report.json

      - name: Prepare immutable data generation
        run: |
          generation_id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          echo "GENERATION_ID=${generation_id}" >> "${GITHUB_ENV}"
          GENERATION_ID="${generation_id}" GITHUB_SHA="${GITHUB_SHA}" node scripts/prepare_data_generation.js

      - name: Publish content-addressed README blobs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync .readme-content-stage/ "s3://${R2_BUCKET}/readmes/"             --endpoint-url "${endpoint}" --only-show-errors
          echo "Published $(find .readme-content-stage -name '*.md' | wc -l) content-addressed README blob(s)."

      - name: Upload immutable data generation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync .generation-stage/ "s3://${R2_BUCKET}/generations/${GENERATION_ID}/" \
            --endpoint-url "${endpoint}" --only-show-errors

      - name: Validate candidate generation hashes, vectors and README refs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/validate_remote_generation.js --generation "${GENERATION_ID}"

      - name: Mark validated generation ready
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          printf '{"schema":1,"generation":"%s","commit":"%s","validated_at":"%s"}\n' \
            "${GENERATION_ID}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${RUNNER_TEMP}/generation-ready.json"
          aws s3 cp "${RUNNER_TEMP}/generation-ready.json" \
            "s3://${R2_BUCKET}/generations/${GENERATION_ID}/ready.json" --endpoint-url "${endpoint}" --only-show-errors

      - name: Activate verified data generation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp active-generation.json "s3://${R2_BUCKET}/active-generation.json" --endpoint-url "${endpoint}"
          aws s3 cp "s3://${R2_BUCKET}/active-generation.json" "${RUNNER_TEMP}/active-generation.json" --endpoint-url "${endpoint}"
          cmp active-generation.json "${RUNNER_TEMP}/active-generation.json"
          echo "✓ activated generation ${GENERATION_ID}"

      - name: Retain latest validated data generations
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "generations/" --delimiter "/" \
            --endpoint-url "${endpoint}" --output json > "${RUNNER_TEMP}/generations.json"
          mapfile -t prefixes < <(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1]));for(const x of (d.CommonPrefixes||[]).map(v=>v.Prefix).sort().reverse()) console.log(x)' "${RUNNER_TEMP}/generations.json")
          ready=()
          for prefix in "${prefixes[@]}"; do
            marker="${prefix}ready.json"
            if aws s3api head-object --bucket "${R2_BUCKET}" --key "${marker}" --endpoint-url "${endpoint}" >/dev/null 2>"${RUNNER_TEMP}/ready-head.err"; then
              ready+=("${prefix}")
            elif grep -q "HeadObject" "${RUNNER_TEMP}/ready-head.err" && grep -Eq "\(404\)|NoSuchKey" "${RUNNER_TEMP}/ready-head.err"; then
              aws s3 rm "s3://${R2_BUCKET}/${prefix}" --recursive --endpoint-url "${endpoint}" --only-show-errors
              echo "✓ removed incomplete generation ${prefix}"
            else
              echo "::error::Could not inspect ${marker}:"
              cat "${RUNNER_TEMP}/ready-head.err"
              exit 1
            fi
          done
          for ((i=GENERATION_RETENTION; i<${#ready[@]}; i++)); do
            prefix="${ready[$i]}"
            if [ "${prefix}" = "generations/${GENERATION_ID}/" ]; then
              echo "::error::Refusing to delete the newly activated generation ${prefix}"
              exit 1
            fi
            aws s3 rm "s3://${R2_BUCKET}/${prefix}" --recursive --endpoint-url "${endpoint}" --only-show-errors
            echo "✓ removed old validated generation ${prefix}"
          done
          echo "Retained up to ${GENERATION_RETENTION} validated generation(s)."
