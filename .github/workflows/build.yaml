name: Update Repos Info

on:
  schedule:
    # Runs every 6 hours (00:22, 06:22, 12:22, 18:22 UTC) to keep community rankings and new stars fresh
    - cron: '22 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege: this job publishes through R2 and the Worker's own credentials, never through
    # git. It carried `contents: write` for the commit-and-push step that used to publish its
    # outputs; that step is gone (§P2), so the token no longer needs to write anything.
    permissions:
      contents: read
    # Two overlapping runs would race on the bucket-root `aws s3 sync --delete` and on the document
    # uploads, so they are serialised. (The race used to include `git push` as well; that half went
    # away when the job stopped committing.)
    concurrency:
      group: stars-radar-data-publish
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
      RETRIEVAL_BENCHMARK_B64: ${{ secrets.RETRIEVAL_BENCHMARK_B64 }}
      GENERATION_RETENTION: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Resolve active data generation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if aws s3api head-object --bucket "${R2_BUCKET}" --key "active-generation.json" \
            --endpoint-url "${endpoint}" >/dev/null 2>dl.err; then
            aws s3 cp "s3://${R2_BUCKET}/active-generation.json" active-generation.json --endpoint-url "${endpoint}"
            active=$(node --input-type=module -e 'import fs from "node:fs"; import { parseGenerationPointer } from "./src/data-generation.js"; console.log(parseGenerationPointer(JSON.parse(fs.readFileSync("active-generation.json","utf-8"))).id)')
            echo "ACTIVE_GENERATION_ID=${active}" >> "${GITHUB_ENV}"
            echo "Active data generation: ${active}"
          elif grep -q "HeadObject" dl.err && grep -Eq "\(404\)|NoSuchKey" dl.err; then
            echo "ACTIVE_GENERATION_ID=" >> "${GITHUB_ENV}"
            echo "No active generation yet; bootstrapping a fresh v2 data plane."
          else
            echo "::error::Could not resolve active-generation.json:"
            cat dl.err
            exit 1
          fi
          rm -f dl.err

      - name: Download current vector generation from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rm -f embeddings.bin embeddings-index.json embeddings-fingerprints.json embeddings-manifest.json
          if [ -z "${ACTIVE_GENERATION_ID}" ]; then
            echo "Fresh data plane: no vector baseline to restore."
            exit 0
          fi
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="generations/${ACTIVE_GENERATION_ID}"
          if aws s3api head-object --bucket "${R2_BUCKET}" --key "${prefix}/embeddings-manifest.json" \
            --endpoint-url "${endpoint}" >/dev/null 2>vector-head.err; then
            for obj in embeddings.bin embeddings-index.json embeddings-fingerprints.json embeddings-manifest.json; do
              aws s3 cp "s3://${R2_BUCKET}/${prefix}/${obj}" "${obj}" --endpoint-url "${endpoint}"
            done
          elif grep -q "HeadObject" vector-head.err && grep -Eq "\(404\)|NoSuchKey" vector-head.err; then
            echo "Active generation ${ACTIVE_GENERATION_ID} has no vector set (empty semantic corpus)."
          else
            echo "::error::Could not inspect the active generation vector set:"
            cat vector-head.err
            exit 1
          fi
          rm -f vector-head.err

      - name: Download the ingest journal from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          mkdir -p state/ingest-journal
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # The journal is append-only between builds. This run folds only the tail not covered by
          # the previous generation snapshot; exact raw keys proven durable in that previous
          # generation may be deleted only after the new generation becomes active. Not being here
          # on a first run is normal, but a listing failure must not be mistaken for an empty journal.
          #
          # `aws s3 ls` cannot draw that line: it exits non-zero for a prefix that does not exist
          # yet, so a first run looked like a credentials failure. `list-objects-v2` answers 200
          # with zero keys for an absent prefix and only fails when the request itself fails.
          # Prints how many objects live under a prefix. Exits non-zero only when the request
          # itself failed, so a prefix that is merely absent counts as zero instead of looking
          # like a credentials problem.
          #
          # The count comes from the JSON listing, not `--query KeyCount`: that prints the literal
          # string "None" for an empty listing, which then compares as a string against a number
          # and makes the guards depending on it silently inert.
          count_objects() {
            local listing
            listing=$(aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "$1" \
              --endpoint-url "${endpoint}" --output json 2>"${RUNNER_TEMP}/stars-radar-ls.err") || return 1
            printf '%s' "${listing}" | grep -c '"Key"' || true
          }
          if keys=$(count_objects "state/ingest-journal/"); then
            echo "Ingest journal objects in R2: ${keys}"
            aws s3 sync "s3://${R2_BUCKET}/state/ingest-journal/" state/ingest-journal/ \
              --endpoint-url "${endpoint}" \
              --exclude "*" --include "*.jsonl"
            echo "Ingest journal objects downloaded: $(find state/ingest-journal -name '*.jsonl' | wc -l)"
          else
            echo "::error::Could not list the ingest journal prefix. An empty fold would silently drop every curated entry, so this run is stopped rather than publishing an asset state without them:"
            cat "${RUNNER_TEMP}/stars-radar-ls.err"
            exit 1
          fi

      - name: Download active generation baseline from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rm -f catalog.json asset-state.json previous-asset-index.json
          mkdir -p rankings
          rm -f rankings/rankings.json
          if [ -z "${ACTIVE_GENERATION_ID}" ]; then
            echo "Fresh data plane: no derived baseline to restore."
          else
            aws configure set default.region auto
            endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            prefix="generations/${ACTIVE_GENERATION_ID}"
            for spec in "catalog.json:catalog.json" "rankings.json:rankings/rankings.json" "asset-state.json:asset-state.json" "asset-index.json:previous-asset-index.json"; do
              key="${spec%%:*}"
              local_path="${spec##*:}"
              aws s3 cp "s3://${R2_BUCKET}/${prefix}/${key}" "${local_path}" --endpoint-url "${endpoint}"
            done
          fi

          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          listing=$(aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "state/ingest-journal/" \
            --endpoint-url "${endpoint}" --output json)
          before=$(printf '%s' "${listing}" | grep -c '"Key"' || true)
          echo "BEFORE_INGEST_OBJECTS=${before}" >> "${GITHUB_ENV}"
          echo "Ingest journal objects before this run: ${before}"

      - name: Download Worker-side probe captures from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          mkdir -p state/probe-captures
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Probe captures follow the same one-generation delayed compaction rule as ingests:
          # previous-generation keys are already durable in asset-state/index, while captures first
          # seen by this run stay raw until a later generation proves they were folded. Recursive
          # prefix deletion is never allowed.
          #
          # `list-objects-v2` rather than `s3 ls`: an absent prefix is zero keys, not a failure.
          # Prints how many objects live under a prefix. Exits non-zero only when the request
          # itself failed, so a prefix that is merely absent counts as zero instead of looking
          # like a credentials problem.
          #
          # The count comes from the JSON listing, not `--query KeyCount`: that prints the literal
          # string "None" for an empty listing, which then compares as a string against a number
          # and makes the guards depending on it silently inert.
          count_objects() {
            local listing
            listing=$(aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "$1" \
              --endpoint-url "${endpoint}" --output json 2>"${RUNNER_TEMP}/stars-radar-ls.err") || return 1
            printf '%s' "${listing}" | grep -c '"Key"' || true
          }
          if keys=$(count_objects "state/probe-captures/"); then
            echo "Probe capture objects in R2: ${keys}"
            aws s3 sync "s3://${R2_BUCKET}/state/probe-captures/" state/probe-captures/ \
              --endpoint-url "${endpoint}" \
              --exclude "*" --include "*.jsonl"
            echo "Probe capture objects downloaded: $(find state/probe-captures -name '*.jsonl' | wc -l)"
          else
            echo "::error::Could not list the probe capture prefix. An empty fold would silently drop every probe hit, so this run is stopped rather than publishing an asset state without them:"
            cat "${RUNNER_TEMP}/stars-radar-ls.err"
            exit 1
          fi

      - name: Restore active generation README corpus
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rm -rf stars
          mkdir -p stars
          if [ -z "${ACTIVE_GENERATION_ID}" ]; then
            echo "Fresh data plane: no README corpus to restore."
            exit 0
          fi
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://${R2_BUCKET}/generations/${ACTIVE_GENERATION_ID}/readmes.json"             "${RUNNER_TEMP}/readmes.json" --endpoint-url "${endpoint}"
          node --input-type=module - "${RUNNER_TEMP}/readmes.json" > "${RUNNER_TEMP}/readmes.tsv" <<'NODE'
          import fs from 'node:fs'
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          for (const ref of Object.values(manifest.repos || {})) {
            if (ref.object_key)
              process.stdout.write(`${ref.object_key}\tstars/${ref.repo}.md\n`)
          }
          NODE
          export endpoint R2_BUCKET
          xargs -0 -r -P 16 -n 2 bash -c '
            key="$1"; local_path="$2"
            mkdir -p "$(dirname "$local_path")"
            aws s3 cp "s3://${R2_BUCKET}/${key}" "$local_path" --endpoint-url "${endpoint}" --only-show-errors
          ' _ < <(awk -F '\t' '{printf "%s%c%s%c",$1,0,$2,0}' "${RUNNER_TEMP}/readmes.tsv")
          echo "Restored $(find stars -name '*.md' | wc -l) README(s) from active generation ${ACTIVE_GENERATION_ID}."

      - name: Fetch starred repos and READMEs (incremental)
        run: pnpm build:stars
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}

      - name: Build unified asset index (accumulate starred + community + probes)
        run: node scripts/asset_store.js

      - name: Verify embeddings.bin invariant before upload
        run: node scripts/verify_vector_pair.js

      - name: Require private retrieval closure benchmark
        run: |
          test -n "${RETRIEVAL_BENCHMARK_B64}" || { echo "::error::RETRIEVAL_BENCHMARK_B64 is required before candidate data activation"; exit 1; }
          printf '%s' "${RETRIEVAL_BENCHMARK_B64}" | base64 --decode > data/retrieval-benchmark.private.json
          node scripts/validate_private_benchmark.js data/retrieval-benchmark.private.json

      - name: Enforce candidate production regression smoke gate
        run: |
          node scripts/build_retrieval_benchmark_from_corpus.js --output data/retrieval-benchmark.derived.json
          pnpm eval:retrieval:gate -- \
            --fixture data/retrieval-benchmark.derived.json \
            --output retrieval-regression-derived-report.json

      - name: Enforce private candidate retrieval quality gate
        run: |
          pnpm eval:retrieval:gate -- \
            --fixture data/retrieval-benchmark.private.json \
            --output retrieval-quality-private-report.json

      - name: Prepare immutable data generation
        run: |
          generation_id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          echo "GENERATION_ID=${generation_id}" >> "${GITHUB_ENV}"
          GENERATION_ID="${generation_id}" GITHUB_SHA="${GITHUB_SHA}" node scripts/prepare_data_generation.js

      - name: Publish content-addressed README blobs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync .readme-content-stage/ "s3://${R2_BUCKET}/readmes/"             --endpoint-url "${endpoint}" --only-show-errors
          echo "Published $(find .readme-content-stage -name '*.md' | wc -l) content-addressed README blob(s)."

      - name: Upload immutable data generation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync .generation-stage/ "s3://${R2_BUCKET}/generations/${GENERATION_ID}/" \
            --endpoint-url "${endpoint}" --only-show-errors

      - name: Verify immutable generation in R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          verify_dir="${RUNNER_TEMP}/generation-verify"
          rm -rf "${verify_dir}"
          mkdir -p "${verify_dir}"
          failed=0
          while IFS= read -r rel; do
            mkdir -p "${verify_dir}/$(dirname "${rel}")"
            if ! aws s3 cp "s3://${R2_BUCKET}/generations/${GENERATION_ID}/${rel}" \
              "${verify_dir}/${rel}" --endpoint-url "${endpoint}" --only-show-errors; then
              echo "::error::Could not read generations/${GENERATION_ID}/${rel} back from R2"
              failed=1
              continue
            fi
            if cmp -s ".generation-stage/${rel}" "${verify_dir}/${rel}"; then
              echo "✓ generations/${GENERATION_ID}/${rel}: exact content verified"
            else
              echo "::error::generations/${GENERATION_ID}/${rel} differs from the staged artifact"
              failed=1
            fi
          done < <(find .generation-stage -type f -printf '%P\n' | sort)
          exit ${failed}

      - name: Validate candidate generation hashes, vectors and README refs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/validate_remote_generation.js --generation "${GENERATION_ID}"

      - name: Activate verified data generation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp active-generation.json "s3://${R2_BUCKET}/active-generation.json" --endpoint-url "${endpoint}"
          aws s3 cp "s3://${R2_BUCKET}/active-generation.json" "${RUNNER_TEMP}/active-generation.json" --endpoint-url "${endpoint}"
          cmp active-generation.json "${RUNNER_TEMP}/active-generation.json"
          echo "✓ activated generation ${GENERATION_ID}"

      - name: Build rollback-safe compaction plan from oldest retained generation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "generations/" --delimiter "/" \
            --endpoint-url "${endpoint}" --output json > "${RUNNER_TEMP}/generations.json"
          mapfile -t retained < <(node --input-type=module - "${RUNNER_TEMP}/generations.json" "${GENERATION_RETENTION}" <<'NODE'
          import fs from 'node:fs'
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const limit = Number(process.argv[3])
          for (const prefix of (payload.CommonPrefixes || []).map(item => item.Prefix).sort().reverse().slice(0, limit))
            console.log(prefix)
          NODE
          )
          test "${#retained[@]}" -gt 0 || { echo "::error::No retained generations found after activation"; exit 1; }
          oldest="${retained[${#retained[@]}-1]}"
          echo "Compaction recovery horizon: ${oldest}"
          aws s3 cp "s3://${R2_BUCKET}/${oldest}asset-index.json" "${RUNNER_TEMP}/compaction-base-asset-index.json" \
            --endpoint-url "${endpoint}" --only-show-errors
          node scripts/build_compaction_plan.js --index "${RUNNER_TEMP}/compaction-base-asset-index.json"

      - name: Compact consumed append-only state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mapfile -t keys < <(node -e 'const p=require("./.data-compaction-plan.json"); for (const k of [...p.ingest_keys,...p.probe_keys]) console.log(k)')
          for key in "${keys[@]}"; do
            [ -n "${key}" ] || continue
            aws s3api delete-object --bucket "${R2_BUCKET}" --key "${key}" --endpoint-url "${endpoint}" >/dev/null
            echo "✓ compacted ${key}"
          done

      - name: Retain the three newest data generations
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "generations/" --delimiter "/" \
            --endpoint-url "${endpoint}" --output json > "${RUNNER_TEMP}/generations.json"
          mapfile -t prefixes < <(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1]));for(const x of (d.CommonPrefixes||[]).map(v=>v.Prefix).sort().reverse()) console.log(x)' "${RUNNER_TEMP}/generations.json")
          for ((i=GENERATION_RETENTION; i<${#prefixes[@]}; i++)); do
            prefix="${prefixes[$i]}"
            if [ "${prefix}" = "generations/${GENERATION_ID}/" ]; then
              echo "::error::Refusing to delete the active generation ${prefix}"
              exit 1
            fi
            aws s3 rm "s3://${R2_BUCKET}/${prefix}" --recursive --endpoint-url "${endpoint}" --only-show-errors
            echo "✓ removed old generation ${prefix}"
          done

      - name: Garbage collect unreferenced README blobs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws configure set default.region auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          work="${RUNNER_TEMP}/readme-gc"
          rm -rf "${work}"
          mkdir -p "${work}/manifests"
          aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "generations/" --delimiter "/"             --endpoint-url "${endpoint}" --output json > "${work}/generations.json"
          node --input-type=module - "${work}/generations.json" > "${work}/prefixes.txt" <<'NODE'
          import fs from 'node:fs'
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          for (const item of data.CommonPrefixes || [])
            process.stdout.write(item.Prefix + '\n')
          NODE
          while IFS= read -r prefix; do
            [ -n "${prefix}" ] || continue
            id="${prefix#generations/}"
            id="${id%/}"
            aws s3 cp "s3://${R2_BUCKET}/${prefix}readmes.json" "${work}/manifests/${id}.json"               --endpoint-url "${endpoint}" --only-show-errors
          done < "${work}/prefixes.txt"
          node --input-type=module - "${work}/manifests" > "${work}/keep.txt" <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          const dir = process.argv[2]
          const keep = new Set()
          for (const file of fs.readdirSync(dir)) {
            const data = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'))
            for (const ref of Object.values(data.repos || {}))
              if (ref.object_key) keep.add(ref.object_key)
          }
          for (const key of [...keep].sort())
            process.stdout.write(key + '\n')
          NODE
          aws s3 ls "s3://${R2_BUCKET}/readmes/" --recursive --endpoint-url "${endpoint}"             | awk '{print $4}' > "${work}/all.txt"
          while IFS= read -r key; do
            [ -n "${key}" ] || continue
            if ! grep -Fxq "${key}" "${work}/keep.txt"; then
              aws s3api delete-object --bucket "${R2_BUCKET}" --key "${key}" --endpoint-url "${endpoint}" >/dev/null
              echo "✓ removed unreferenced README blob ${key}"
            fi
          done < "${work}/all.txt"
